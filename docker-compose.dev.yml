# Local dev: infra + the Go API in Docker; the frontend is built on the host
# and embedded at server build time.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d postgres blob dex api
#   scripts/restart.sh          # rebuild frontend + restart api
#
# The api runs `go run` inside golang:1.27 (Linux), so Windows Smart App
# Control never sees the binary. Module/build caches persist in volumes.
services:
  postgres:
    ports: ["5433:5432"]
  blob:
    ports: ["9000:9000"]

  api:
    image: golang:1.27
    working_dir: /src
    command: ["sh", "/src/scripts/container-server.sh"]
    volumes:
      - ./:/src
      # Host module cache (read-only): no network needed in the container.
      - "C:/Users/Ayush/go/pkg/mod:/go/pkg/mod:ro"
      - gocache:/root/.cache/go-build
    ports:
      - "8080:8080"
    extra_hosts:
      # Browsers reach Dex at localhost:5556; inside the container the same
      # issuer URL must also resolve, so point localhost:5556 traffic at dex.
      - "host.docker.internal:host-gateway"
    environment:
      GOFLAGS: -mod=mod
      GOPROXY: "off"
      GOTOOLCHAIN: local
      DATABASE_URL: postgres://slashdocs:slashdocs@postgres:5432/slashdocs?sslmode=disable
      SLASHDOCS_MIGRATE: "true"
      SLASHDOCS_KV_EVENTS_MODE: notify
      BLOB_BUCKET: slashdocs-documents
      BLOB_ENDPOINT: http://blob:9000
      BLOB_FORCE_PATH_STYLE: "true"
      BLOB_ACCESS_KEY_ID: blobadmin
      BLOB_SECRET_ACCESS_KEY: blobadmin
      BLOB_REGION: us-east-1
      SLASHDOCS_APP_ORIGIN: http://localhost:8080
      SLASHDOCS_RENDER_ORIGIN: http://127.0.0.1:8080
      SLASHDOCS_OIDC_ISSUER_URL: http://localhost:5556/dex
      SLASHDOCS_OIDC_INTERNAL_ISSUER_URL: http://dex:5556/dex
      SLASHDOCS_OIDC_CLIENT_ID: slashdocs
      SLASHDOCS_OIDC_CLIENT_SECRET: slashdocs-dev-secret
      SLASHDOCS_OIDC_PROVIDER_NAME: Dex
      SESSION_SECRET: dev-only-session-secret-0123456789abcdef
      # Forge design engine: Stitch + Katalyst (personal GCP project).
      STITCH_API_KEY: ${STITCH_API_KEY:-}
      STITCH_CREDENTIALS_FILE: /src/.secrets/stitch-personal.json
      STITCH_PROJECT: forge-stitch-261104
      FORGE_DESIGN_MD: /src/design/katalyst.DESIGN.md
      FORGE_STITCH_PROJECT_ID: "3828330232627373588"
      FORGE_STITCH_DESIGN_SYSTEM: assets/dab0e246b3314cee95056f31ce8da142
    depends_on:
      postgres:
        condition: service_healthy
      blob:
        condition: service_healthy
      dex:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:8080/readyz"]
      interval: 3s
      timeout: 3s
      retries: 200

volumes:
  gocache:
